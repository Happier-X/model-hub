[package]
name = "model-hub"
version = "0.1.1"
description = "Model Hub 桌面管理应用（Vue3 + 内嵌代理）"
authors = ["Model Hub Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "model_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
axum = { version = "=0.8.9", features = ["json"] }
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-single-instance = "=2.4.3"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
wiremock = "=0.6.5"
